{% extends 'base.html' %}
{% load static %}

{% block title %}Página não encontrada{% endblock %}

{% block content %}
  <div class="container text-center py-5">
    <img src="{% static 'images/images-default/Icontransparent.png' %}" alt="Logo SEA" style="height: 150px; opacity: 0.5;" class="mb-4">
    <h1 class="display-1 fw-bold text-secondary">404</h1>
    <h2>Ops! Página não encontrada.</h2>
    <p class="text-muted mb-4">A página que você está procurando não existe, foi removida ou o endereço está incorreto.</p>
    
    <!-- Altere 'app_login:urllogin' ou 'home' para a url inicial do seu projeto -->
    <a href="{% url 'app_evento:urlhome' %}" class="btn btn-primary">Voltar para o Início</a>
  </div>
{% endblock %}
