{% extends 'base.html' %}
{% load static %}
{% load bootstrap5 %}

{% block title %}
  Cadastrar Atividade
{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        
          <h2 class="fw-bold text-verde-escuro mb-4">Cadastrar Nova Atividade de {{ evento_atual.nome }} 📅</h2>
        

        <form method="POST" class="card p-4 shadow-sm bg-white">
          {% csrf_token %}

          {{ form_atividade.as_p }}
          
          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{% url 'app_evento:urlhome' %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-success">Salvar Atividade</button>
          </div>
        </form>

      </div>
    </div>
  </div>
</section>
{% endblock %}
