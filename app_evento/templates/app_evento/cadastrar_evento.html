{% extends 'base.html' %}
{% load static %}
{% load bootstrap5 %}

{% block title %}
  Criar Evento
{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <h2 class="fw-bold text-verde-escuro mb-4">Cadastrar Novo Evento 📅</h2>

        <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm bg-white">
          {% csrf_token %}

          {{ form_evento.as_p }}

          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{% url 'urlindex' %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-success">Salvar Evento</button>
          </div>
        </form>

      </div>
    </div>
  </div>
</section>
{% endblock %}
